[project]
name = "rss2email"
description = "Forward RSS feeds to your email address"
readme = "README.rst"
license = "GPL-2.0-only"
authors = [{name = "The rss2email maintainers", email = "rss2email@tremily.us"}]
requires-python = ">=3.8"
dynamic = ["version"]
dependencies = [
    "feedparser>=6.0.5",
    "html2text==2020.1.16",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/rss2email/rss2email"

[project.scripts]
r2e = "rss2email.main:run"

[project.optional-dependencies]
dev = [
    "update-copyright>=0.6.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rss2email", "rss2email.post_process"]

[tool.setuptools.dynamic]
version = {attr = "rss2email.__version__"}