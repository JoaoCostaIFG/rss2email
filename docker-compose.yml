# Example docker-compose deployment for the rss2email web UI.
#
# The container runs as an unprivileged user (UID/GID 1000) with a
# read-only root filesystem; only the named data volume and a tmpfs
# /tmp are writable.
#
# The image pre-creates and pre-owns /data/config and /data/data
# (UID/GID 1000) in its build layer. Docker copies that ownership
# into a freshly-attached named volume on first mount, so the
# unprivileged in-container user can write to them out of the box --
# no host-side mkdir/chown or init container is needed.
#
#     docker compose up -d
#
# The web UI will be available at http://localhost:8080. It has no
# authentication -- bind it to 127.0.0.1 or put it behind a VPN/reverse
# proxy if you need remote access. See `r2e help web` for options.

services:
  rss2email-web:
    build: .
    image: rss2email:local
    container_name: rss2email-web
    restart: unless-stopped

    # Run as the unprivileged UID/GID 1000 user created in the image.
    user: "1000:1000"

    # The root filesystem is read-only. Only the named volume below and
    # the tmpfs /tmp are writable, which limits what a compromised
    # process can touch.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

    # docker sends SIGTERM on `docker stop`; rss2email's web server
    # handles SIGTERM and shuts down cleanly, so no init shim is needed.

    ports:
      - "8080:8080"

    volumes:
      # Single named volume covering config + feed database.
      #   config: /data/config/rss2email.cfg
      #   data:   /data/data/rss2email.json
      # Both subdirectories are pre-created and owned by UID/GID 1000
      # in the image; the named volume inherits that ownership on first
      # mount, and the files themselves are created on first use by the
      # entrypoint.
      - r2e-data:/data

volumes:
  r2e-data: